name: provis
description: >-
  Procedural 2.5D isometric visuals for Flutter and Flame. Draw characters,
  monsters, trees, rocks and buildings from code alone — no sprite sheets —
  with multi-pass shading and click-to-move pathing on an isometric grid.
version: 0.1.0
repository: https://github.com/thruthesky/provis
issue_tracker: https://github.com/thruthesky/provis/issues
topics:
  - game
  - flame
  - isometric
  - procedural
  - graphics

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Flame 은 선택적 통합(src/flame/)에서만 쓴다. 핵심 렌더는 dart:ui 만으로
  # 동작하므로 Flame 을 쓰지 않는 Flutter 앱에서도 그대로 쓸 수 있다.
  flame: ^1.38.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

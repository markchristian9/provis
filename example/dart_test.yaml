# 테스트 분류.
#
# ## 왜 필요한가
#
# 이 저장소의 테스트는 두 종류가 섞여 있다.
#
# 1. **검증** — 스케일·통행·공개 API 처럼 옳고 그름을 가리는 것. 몇 초 안에
#    끝나고, 깨지면 코드가 잘못된 것이다.
# 2. **굽기** — 캐릭터 시트·기물 시트·성능 측정처럼 **사람이 눈으로 보거나
#    수치를 읽으려고** PNG 와 숫자를 만들어 내는 것. 한 장에 수 분씩 걸린다.
#
# 둘을 한 통에 두면 `flutter test` 가 10분 타임아웃에 걸려 빨갛게 끝나고,
# 그러면 **진짜 회귀와 그냥 느린 것을 구별할 수 없게 된다.** 실제로 이
# 저장소는 그 상태였다 — 굽기 4종이 늘 실패해 있어서 아무도 빨간불을 믿지
# 않았다.
#
# 그래서 굽기에는 `sheets` 태그를 달고 기본 실행에서 뺀다.
#
# ```bash
# flutter test                                  # 검증만. 빠르고 초록이어야 한다
# flutter test --run-skipped --tags sheets      # 굽기. 이미지와 수치를 만든다
# ```

tags:
  sheets:
    skip: "이미지·성능 굽기. 실행: flutter test --run-skipped --tags sheets"
